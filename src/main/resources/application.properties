spring.application.name=GerenciaDeEscola
spring.datasource.url=jdbc:mysql://localhost:3306/gerenciadeescola
spring.datasource.username=root
spring.datasource.password=
# CORREÇÃO AQUI: Altere ou remova essa linha. O Spring Boot já descobre o driver
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=update

# Permite o Spring ligar ignorando tabelas faltando no JPA até o Flyway criar tudo
spring.jpa.defer-datasource-initialization=true

# 2. O SEGREDO DO SUCESSO: Desative a criação automática do JPA
spring.jpa.hibernate.ddl-auto=none

# 3. Ative o Flyway
spring.flyway.enabled=true
# (Opcional) Se o seu banco já tiver tabelas antigas criadas manualmente, adicione esta linha:
spring.flyway.baseline-on-migrate=true
# 4. Permite arquivos de migração vazios por enquanto
spring.flyway.allow-empty-migrations=true
debug=true